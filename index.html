<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Симулятор двигуна</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--panel:#141417;--ink:#f2f2f2;--dim:#8a8a90;--line:#2a2a30;--acc:#ff8a00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100%;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{height:100%;max-width:520px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.top{display:flex;gap:8px}
select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 30px 8px 14px;background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),linear-gradient(135deg,var(--acc) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
#eng{border:2px solid var(--acc)}
#v3{flex:1;min-height:100px;position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
#v3 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.leg{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--dim);pointer-events:none}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 0 6px}
#slow{position:absolute;right:8px;top:8px;font-size:11px;padding:4px 10px;border-radius:14px}
#slow.on{border-color:var(--acc);color:var(--acc)}
#gau{width:100%;height:auto;display:block}
small{font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:600}
.stats{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 0}
.stats div{flex:1;text-align:center;border-right:1px solid var(--line)}.stats div:last-child{border:0}
.stats b{font-size:22px;font-weight:600;margin-right:4px}
.ctl{display:flex;gap:8px}
.pedals{flex:1;display:flex;gap:6px;min-width:0}
.pw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}.pw[data-k=g]{flex:.8}
.pw b{font-size:13px;font-weight:600}
.pedal{position:relative;width:100%;height:96px;border-radius:12px;background:#0e0e11;border:1px solid var(--line);touch-action:none;cursor:pointer;overflow:hidden}
.pedal i{position:absolute;left:12%;right:12%;height:40%;bottom:calc((100% - 40%)*var(--p,0));border-radius:9px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 3px,transparent 3px 12px),linear-gradient(#cfcfd4,#6e6e74);box-shadow:0 3px 8px #000a}
.pedal[data-k=g] i{left:28%;right:28%;height:72%;bottom:calc((100% - 72%)*var(--p,0))}
.shiftbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
#gbig{font-size:20px;background:#1d1d22;border-radius:9px;padding:0 10px;color:var(--dim)}
#shift{touch-action:none;cursor:grab;position:relative;display:grid;grid-template-columns:repeat(3,40px);grid-auto-rows:32px;gap:8px}
#shift button{pointer-events:none;position:relative;z-index:1;padding:0;border-radius:8px;background:#1d1d22;font-size:16px}
.rail{position:absolute;background:#0c0c0e;border-radius:4px;z-index:0}
#knob.drag{transition:none}
#knob{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#55555c,#202024);border:1px solid #666;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;z-index:2;pointer-events:none;transition:transform .15s}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:600;touch-action:manipulation}
#start{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;padding:12px;border-radius:26px;border:2px solid var(--line)}
#start:not(.on){background:var(--acc);border-color:var(--acc);color:#0a0a0c}
.ic{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative;display:inline-block}
.ic::after{content:"";position:absolute;inset:6px;background:#0a0a0c;border-radius:2px}
.ic.play{background:#0a0a0c}.ic.play::after{inset:5px 4px 5px 8px;border-radius:0;background:var(--acc);clip-path:polygon(0 0,100% 50%,0 100%)}
#msg{height:18px;font-weight:600;font-size:13px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><main>
<div class="top"><select id="eng"></select><select id="trn"><option value="mt">МКП</option><option value="at">АКП</option><option value="dct">Робот DCT</option></select></div>
<div id="v3"><div class="leg"><i style="background:#3b8fb8"></i>Впуск<i style="background:#e0b34a"></i>Стиск<i style="background:#ff7a28"></i>Робочий хід<i style="background:#8c9196"></i>Випуск</div><button id="slow" class="on">Повільно</button></div>
<canvas id="gau" width="480" height="180"></canvas>
<div class="stats"><div><b id="tmp">30</b><small>ТЕМП °C</small></div><div><b id="bar">0.0</b><small>БАР</small></div><div><b id="kmh">0</b><small>КМ/ГОД</small></div></div>
<div class="ctl">
<div class="pedals">
<div class="pw" data-k="c"><small>ЗЧЕПЛ.</small><div class="pedal" data-k="c"><i></i></div><b id="pvc">0%</b></div>
<div class="pw" data-k="b"><small>ГАЛЬМО</small><div class="pedal" data-k="b"><i></i></div><b id="pvb">0%</b></div>
<div class="pw" data-k="g"><small>ГАЗ</small><div class="pedal" data-k="g"><i></i></div><b id="pvg">0%</b></div>
</div>
<div class="shiftbox"><div class="gh"><small>ПЕРЕДАЧА</small><b id="gbig">N</b></div><div id="shift"></div></div>
</div>
<div id="msg"></div>
<button id="start"></button>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),dpr=Math.min(devicePixelRatio||1,2);
const ENGS=[
{n:4,v:0,l:'R4 · 1,6 л',t:190,rl:7000,I:.3,j:.12,s:1.3,ord:[0,2,3,1],idle:850},
{n:6,v:60,l:'V6 · 3,5 л',t:380,rl:7200,I:.35,j:.15,s:1.2,idle:850},
{n:8,v:90,l:'V8 · 5,0 л',t:560,rl:7400,I:.45,j:.3,s:1.15,idle:800},
{n:10,v:72,l:'V10 · 5,2 л',t:680,rl:8800,I:.5,j:.12,s:1.0,idle:800},
{n:12,v:60,l:'V12 · 6,5 л',t:850,rl:8900,I:.6,j:.05,s:.95,idle:750}];
let ENG=ENGS[4],M=1560;
const RAT={1:3.4,2:2.3,3:1.65,4:1.22,5:.9,6:.62,'-1':-3.4},FIN=3.9,RW=.3,RATE={c:[5,1.8],b:[6,5],g:[4,5]};
const S={temp:30,dist:0,lit:0,lph:0,lq:0,wa:0,wd:0,cq:0,cqOn:0,w:0,v:0,run:0,crank:0,vang:0,gear:0,ag:1,shT:0,ea:0,mode:'mt',p:{c:0,b:0,g:0},h:{c:0,b:0,g:0},grab:{c:0,b:0,g:0},msg:'',mt:0,slow:1};
const ge=()=>S.gear===7?S.ag:S.gear;
function say(t,s=2.2){S.msg=t;S.mt=s}
function curve(x){const P=[[0,.4],[.12,.6],[.3,.85],[.55,1],[.75,.95],[.92,.8],[1.02,.4],[1.25,0]];if(x>=1.25)return 0;for(let i=1;i<P.length;i++)if(x<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return 0}
function step(dt){
 for(const k in S.p){if(S.mode!=='mt'&&k==='c')continue;const[u,d]=RATE[k];if(S.grab[k])S.p[k]=S.h[k];else S.p[k]+=clamp(S.h[k]-S.p[k],-d*dt,u*dt)}
 const rpm=S.w*9.5493,K=Math.pow(ENG.t/180,.7);
 if(S.mode!=='mt'){
  S.shT-=dt;const th=S.p.g;
  if(S.gear===7){if(S.v<.5&&th<.1)S.ag=1;
   if(S.shT<=0){if(rpm>(.28+.6*th)*ENG.rl&&S.ag<6){S.ag++;S.shT=.4}else if(rpm<(.12+.15*th)*ENG.rl&&S.ag>1&&S.v>1){S.ag--;S.shT=.4}}}
  else if(S.mode==='dct'&&S.gear>1&&rpm<1100&&S.run&&S.shT<=0){S.gear--;S.shT=.25;moveKnob()}
  let base=clamp((rpm-ENG.idle-100)/500,0,1);if(S.v>2&&rpm>1400)base=1;
  let tg=Math.max(base,S.mode==='at'?.24:.1);if(S.shT>0)tg=Math.min(tg,.2);
  S.ea+=clamp(tg-S.ea,-6*dt,5*dt);S.p.c=1-S.ea;
 }
 let thr=S.p.g;
 if(S.run){thr=Math.max(thr,clamp((ENG.idle+100-rpm)*.002,0,.35))}
 let T=S.run?thr*ENG.t*curve(rpm/ENG.rl):0;
 const fr=(7+.003*rpm+(S.run?(1-thr)*.008*rpm:.012*rpm))*K;
 if(S.crank>0){T+=70*K;S.crank-=dt;if(rpm>300&&!S.run)S.run=1}
 T-=fr;
 if(S.run&&rpm<350&&S.crank<=0){S.run=0;S.stalls++;say("Двигун заглох!",3)}
 const gi=ge(),G=gi?RAT[gi]*FIN:0,wd=S.v*G/RW,e=1-S.p.c,cap=ENG.t*2.5*e*e;
 const Tc=G?cap*Math.tanh((S.w-wd)/20):0;
 S.w+=(T-Tc)/ENG.I*dt;if(S.w<0)S.w=0;
 const Fd=G?Tc*G/RW:0,Fr=150+.23*S.v*S.v,Fb=S.p.b*M*12;
 if(Math.abs(S.v)<.03&&Math.abs(Fd)<=Fr+Fb)S.v=0;
 else{const sg=Math.sign(S.v)||Math.sign(Fd);S.v+=(Fd-sg*Fr)*dt/M;const dec=Fb*dt/M;if(dec>=Math.abs(S.v))S.v=0;else S.v-=Math.sign(S.v)*dec}
 S.dist+=Math.abs(S.v)*dt;
 S.vang=S.slow?S.vang:(S.vang+S.w*dt*57.2958)%720;
}
S.stalls=0;
function shift(g){
 if(S.mode==='dct'){
  if(g==='u'){if(S.gear===-1)g=0;else if(S.gear<6)g=S.gear+1;else return}
  else if(g==='d'){if(S.gear>1)g=S.gear-1;else if(S.gear===1)g=0;else return}
  if(g!==S.gear&&g>0)S.shT=.25;
 }else if(S.mode==='at'){S.ag=1;S.shT=.3}
 else if(g!==S.gear&&g!==0&&S.p.c<.7){say("Скрегіт! Тисни зчеплення до упору (тягни педаль вгору).",2.5);beep();return}
 if(g===S.gear)return;
 S.gear=g;moveKnob();say(g===0?"Нейтраль":g===-1?"Задній хід":g===7?"Drive":"Передача "+g,1.2);
}
function startBtn(){
 audio();
 if(S.run){S.run=0;say("Двигун вимкнено");return}
 if(S.crank>0)return;
 if(S.gear!==0&&(S.mode==='mt'?S.p.c<.8:S.p.b<.3)){say(S.mode==='mt'?"Для запуску натисни зчеплення або вибери N.":"Для запуску вибери N або натисни гальмо.",2.5);return}
 S.crank=.9;
}
/* shifter UI */
function lab(g){return g===-1?'R':g===0?'N':g===7?'D':g==='u'?'+':g==='d'?'−':g}
function buildShifter(){
 const sh=$('#shift');sh.innerHTML='<div id="knob"></div>';
 const L={mt:[[1,1,1],[3,2,1],[5,3,1],[-1,1,2],[0,2,2],[2,1,3],[4,2,3],[6,3,3]],at:[[-1,2,1],[0,2,2],[7,2,3]],dct:[['u',2,1],[-1,1,2],[0,2,2],['d',2,3]]}[S.mode];
 L.forEach(([g,c,r])=>{const b=document.createElement('button');b.dataset.g=g;b.textContent=lab(g);b.style.gridColumn=c;b.style.gridRow=r;
  sh.appendChild(b)});
 const q=g=>sh.querySelector('button[data-g="'+g+'"]'),ct=b=>[b.offsetLeft+b.offsetWidth/2,b.offsetTop+b.offsetHeight/2];
 const pts=L.map(([g,c,r])=>[c,r,ct(q(g))]),cols=[...new Set(pts.map(p=>p[0]))],rr=(x,y,w,h)=>{const d=document.createElement('div');d.className='rail';d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;sh.insertBefore(d,sh.firstChild)};
 cols.forEach(c=>{const a=pts.filter(p=>p[0]===c).map(p=>p[2]);const x=a[0][0],y1=Math.min(...a.map(p=>p[1])),y2=Math.max(...a.map(p=>p[1]));rr(x-4,y1,8,y2-y1)});
 const xs=pts.map(p=>p[2][0]),n=ct(q(0));if(Math.max(...xs)>Math.min(...xs))rr(Math.min(...xs),n[1]-4,Math.max(...xs)-Math.min(...xs),8);
 const segs=[];cols.forEach(c=>{const a=pts.filter(p=>p[0]===c).map(p=>p[2]);segs.push([a[0][0],Math.min(...a.map(p=>p[1])),a[0][0],Math.max(...a.map(p=>p[1]))])});
 if(Math.max(...xs)>Math.min(...xs))segs.push([Math.min(...xs),n[1],Math.max(...xs),n[1]]);
 SH={slots:pts.map((p,i)=>({g:L[i][0],x:p[2][0],y:p[2][1]})),segs,lock:0};
 moveKnob();
}
let SH=null,SHD=false,gl=0,kp=[0,0];
function moveKnob(){const k=$('#knob');if(!k||SHD)return;let g=S.gear;if(S.mode==='dct'&&g>0)g=0;const b=$('#shift button[data-g="'+g+'"]');if(!b)return;
 kp=[b.offsetLeft+b.offsetWidth/2,b.offsetTop+b.offsetHeight/2];k.textContent=lab(S.gear);k.style.transform=`translate(${kp[0]-17}px,${kp[1]-17}px)`}
/* the lever is dragged along the gate rails like a real shifter */
function proj(px,py){let best=null,bd=1e9;for(const s of SH.segs){const dx=s[2]-s[0],dy=s[3]-s[1],l2=dx*dx+dy*dy,t=l2?clamp(((px-s[0])*dx+(py-s[1])*dy)/l2,0,1):0,x=s[0]+t*dx,y=s[1]+t*dy,d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=[x,y]}}return best}
function dragShift(q){
 let slot=null;for(const s of SH.slots)if(Math.hypot(q[0]-s.x,q[1]-s.y)<13)slot=s;
 if(slot){
  if(S.mode==='mt'){
   if(slot.g!==S.gear){
    if(slot.g!==0&&S.p.c<.7){const nn=SH.slots.find(s=>s.g===0),dx=nn.x-slot.x,dy=nn.y-slot.y,l=Math.hypot(dx,dy)||1;q=[slot.x+dx/l*17,slot.y+dy/l*17];
     if(performance.now()-gl>600){gl=performance.now();say("Скрегіт! Спершу натисни зчеплення до упору (тягни педаль вгору).",2.5);beep()}}
    else{shift(slot.g);q=[slot.x,slot.y]}
   }else q=[slot.x,slot.y];
  }else if(S.mode==='at'){if(slot.g!==S.gear)shift(slot.g);q=[slot.x,slot.y]}
  else if(slot.g==='u'||slot.g==='d'){if(!SH.lock){SH.lock=1;shift(slot.g)}q=[slot.x,slot.y]}
  else if(slot.g===-1){if(S.gear!==-1)shift(-1);q=[slot.x,slot.y]}
  else{SH.lock=0;if(S.gear===-1)shift(0)}
 }else{SH.lock=0;if(S.mode==='mt'&&S.gear!==0){S.gear=0;say("Нейтраль",1)}}
 const k=$('#knob');k.textContent=lab(S.gear);k.style.transform=`translate(${q[0]-17}px,${q[1]-17}px)`;kp=q;
}
const shE=$('#shift');
shE.addEventListener('pointerdown',e=>{if(!SH)return;const r=shE.getBoundingClientRect();if(Math.hypot(e.clientX-r.left-kp[0],e.clientY-r.top-kp[1])>36)return;e.preventDefault();audio();SHD=true;$('#knob').classList.add('drag');shE.setPointerCapture(e.pointerId)});

['pointerup','pointercancel'].forEach(n=>shE.addEventListener(n,()=>{if(!SHD)return;SHD=false;$('#knob').classList.remove('drag');moveKnob()}));
/* gauges */
const gc=$('#gau'),g=gc.getContext('2d');gc.width=480*dpr;gc.height=180*dpr;g.scale(dpr,dpr);
function line(x1,y1,x2,y2,col,w){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function gauge(cx,cy,R,val,max,major,minor,div,red,unit){
 const ang=v=>(135+270*Math.min(v,max)/max)*Math.PI/180,rg=g.createRadialGradient(cx,cy,5,cx,cy,R);
 rg.addColorStop(0,'#232328');rg.addColorStop(1,'#08080a');g.beginPath();g.arc(cx,cy,R,0,7);g.fillStyle=rg;g.fill();g.strokeStyle='#222';g.lineWidth=3;g.stroke();
 if(red){g.beginPath();g.arc(cx,cy,R-7,ang(red),ang(max));g.strokeStyle='#ff2d20';g.lineWidth=5;g.stroke()}
 g.font="600 13px 'Chakra Petch',sans-serif";g.textAlign='center';g.textBaseline='middle';
 for(let k=0;k<=max/minor;k++){const v=k*minor,a=ang(v),B=v%major===0,r1=R-(B?17:11),r2=R-5;
  line(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,B?'#eee':'#777',B?2.5:1.5);
  if(B){g.fillStyle=red&&v>=red?'#ff3b30':'#eee';g.fillText(v/div,cx+Math.cos(a)*(R-30),cy+Math.sin(a)*(R-30))}}
 const a=ang(val),tx=cx+Math.cos(a)*(R-20),ty=cy+Math.sin(a)*(R-20),ng=g.createLinearGradient(cx,cy,tx,ty);ng.addColorStop(0,'#ff9a40');ng.addColorStop(1,'#ff2d20');
 line(cx-Math.cos(a)*12,cy-Math.sin(a)*12,tx,ty,ng,4);
 g.beginPath();g.arc(cx,cy,8,0,7);g.fillStyle='#0b0b0d';g.fill();g.strokeStyle='#3a3a40';g.lineWidth=2;g.stroke();
 g.fillStyle='#8a8a90';g.font="600 10px 'Chakra Petch',sans-serif";g.fillText(unit,cx,cy+26);
}
function drawGauges(){g.clearRect(0,0,480,180);gauge(122,90,84,S.w*9.5493,10000,1000,500,1000,ENG.rl,'ОБ/ХВ ×1000');gauge(358,90,84,Math.abs(S.v)*3.6,400,40,20,1,0,'КМ/ГОД');trip()}
function trip(){g.textAlign='center';g.textBaseline='middle';g.fillStyle='#f2f2f2';g.font="600 14px 'Chakra Petch',sans-serif";g.fillText((S.dist/1000).toFixed(1)+' км',358,140)}
/* 3D engine */
const T=THREE,v3=$('#v3'),R3=new T.WebGLRenderer({antialias:true,alpha:true});R3.setPixelRatio(dpr);v3.prepend(R3.domElement);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(40,1.8,.1,200);
sc.add(new T.AmbientLight(0xffffff,.7));const dl=new T.DirectionalLight(0xffffff,.9);dl.position.set(6,10,10);sc.add(dl);
const spl=new T.PointLight(0xffd75a,0,14);sc.add(spl);
const mat=(c,m,r,o)=>new T.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o||{}));
const steel=mat(0x9aa3ad,.7,.35),dark=mat(0x2b3037,.3,.8),brass=mat(0xc9a24b,.7,.35),cb=mat(0x4aa3c7,.5,.4),cr=mat(0xd9483b,.5,.4),hd=mat(0x3a414a,.5,.6);
const cyl=(a,b,h,n)=>new T.CylinderGeometry(a,b,h,n||24),sideX=o=>{o.rotation.z=Math.PI/2;return o};
function add(geo,m,p,par){const o=new T.Mesh(geo,m);o.position.set(p[0],p[1],p[2]);par.add(o);return o}
const CR=.9,CL=3,YH=4.5,PITCH=2.3,wallG=new T.CylinderGeometry(1,1,2.7,28,1,true,Math.PI/2,Math.PI),wallM=mat(0x8791a0,.2,.5,{transparent:true,opacity:.35,side:T.DoubleSide});
let EG,P=[],FG,LEN=10,az=-.5,ev=.2;
function build(){
 if(EG)sc.remove(EG);EG=new T.Group();sc.add(EG);P=[];
 const n=ENG.n,V=ENG.v*Math.PI/180,np=V?n/2:n;LEN=np*PITCH;
 sideX(add(cyl(.3,.3,LEN+1),dark,[0,0,0],EG));
 FG=new T.Group();FG.position.set(LEN/2+1.4,0,0);EG.add(FG);sideX(add(cyl(1.7,1.7,.5,36),steel,[0,0,0],FG));add(new T.BoxGeometry(.54,.35,.35),brass,[0,1.35,0],FG);
 for(let c=0;c<n;c++){
  const pair=V?c>>1:c,bank=V?c&1:0,x=(pair-(np-1)/2)*PITCH+(V?(bank?.6:-.6):0),be=V?(bank?V/2:-V/2):0,off=(ENG.ord?ENG.ord.indexOf(c):c)*720/n;
  const cg=new T.Group();cg.position.set(x,0,0);cg.rotation.x=be;EG.add(cg);
  add(new T.BoxGeometry(PITCH,6.8,.3),dark,[0,2.5,-1.6],cg);add(wallG,wallM,[0,3.15,0],cg);add(new T.BoxGeometry(2,.5,1.6),hd,[0,4.75,-.8],cg);
  const gas=add(cyl(.93,.93,1,22),mat(0xe0b34a,0,.8,{transparent:true,opacity:.3}),[0,3.5,0],cg);
  const pis=add(cyl(.92,.92,.9),steel,[0,3,0],cg);
  [.2,.05].forEach(y=>{add(new T.TorusGeometry(.92,.04,6,22),dark,[0,y,0],pis).rotation.x=Math.PI/2});
  sideX(add(cyl(.13,.13,1.3,10),dark,[0,0,0],pis));
  const rod=add(new T.BoxGeometry(.3,CL,.22),steel,[0,2,0],cg);
  const vi=new T.Group(),ve=new T.Group();cg.add(vi);cg.add(ve);
  [[vi,-.45,cb],[ve,.45,cr]].forEach(([q,d,m])=>{add(cyl(.05,.05,1.2,8),m,[d,YH+.6,-.35],q);add(cyl(.2,.2,.07,14),m,[d,YH-.03,-.35],q)});
  add(cyl(.1,.1,.5,8),dark,[0,YH+.25,-.1],cg);
  const sph=add(new T.SphereGeometry(.25,10,10),new T.MeshBasicMaterial({color:0xfff0a0}),[0,YH-.2,0],cg);sph.visible=false;
  const cr2=new T.Group();cr2.position.set(x,0,0);EG.add(cr2);
  sideX(add(cyl(.28,.28,1.1,14),brass,[0,CR,0],cr2));
  [-.55,.55].forEach(d=>{add(new T.BoxGeometry(.2,CR,.5),steel,[d,CR/2,0],cr2);add(new T.BoxGeometry(.2,1.1,1.1),brass,[d,-.7,0],cr2)});
  P.push({x,be,off,gas,pis,rod,vi,ve,sph,cr2});
 }
 setCam();
}
function setCam(){const d=Math.max((LEN/2+3.8)/(.364*cam.aspect),12.5)*1.1,t=new T.Vector3(1,2.2,0);cam.position.set(t.x+d*Math.sin(az)*Math.cos(ev),t.y+d*Math.sin(ev),d*Math.cos(az)*Math.cos(ev));cam.lookAt(t)}
function fit(){const w=v3.clientWidth,h=v3.clientHeight;if(!w||!h)return;R3.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();setCam()}
new ResizeObserver(fit).observe(v3);
let dx=null,dy=0;const cv=R3.domElement;
cv.addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(dx!==null){az+=(e.clientX-dx)*.01;ev=clamp(ev+(e.clientY-dy)*.01,-.4,1.3);dx=e.clientX;dy=e.clientY;setCam()}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>dx=null));
function drawEngine(){
 let fire=-1;
 P.forEach((o,i)=>{
  const psi=((S.vang+o.off)%720+720)%720,ph=(psi%360)*Math.PI/180,st=psi<180?0:psi<360?1:psi<540?2:3;
  const cy=CR*Math.cos(ph),cz=CR*Math.sin(ph),py=cy+Math.sqrt(CL*CL-cz*cz);
  o.pis.position.y=py;const top=py+.45;o.gas.scale.y=YH-top;o.gas.position.y=(YH+top)/2;
  o.rod.position.set(0,(py+cy)/2,cz/2);o.rod.rotation.x=Math.atan2(cz,cy-py);o.cr2.rotation.x=ph+o.be;
  const gm=o.gas.material;
  if(st===0&&S.run){gm.color.set(0xff7a28);gm.emissive.set(0xff5a10);gm.emissiveIntensity=1.5*(1-psi/180);gm.opacity=.9-psi/230}
  else{gm.emissiveIntensity=0;
   if(st===0){gm.color.set(0xe0b34a);gm.opacity=.15}else if(st===1){gm.color.set(0x8c9196);gm.opacity=.5}
   else if(st===2){gm.color.set(0x3b8fb8);gm.opacity=.4}else{gm.color.set(0xe0b34a);gm.opacity=.25+(psi-540)/400}}
o.vi.position.y=-(st===2?Math.sin((psi-360)/180*Math.PI)*.3:0);o.ve.position.y=-(st===1?Math.sin((psi-180)/180*Math.PI)*.3:0);
  const f=S.run&&(psi>704||psi<8);o.sph.visible=!!f;if(f){fire=i;const y=YH-.2;spl.position.set(o.x,y*Math.cos(o.be),y*Math.sin(o.be)+1.5)}
 });
 spl.intensity=fire>=0?3:0;FG.rotation.x=S.vang*Math.PI/180;R3.render(sc,cam);
}
/* sound: per-cylinder exhaust pulses through FIXED pipe/body resonances (pitch comes only from firing rate) + intake and roar noise */
function engineSynth(sr){
 let ph=0,cc=0,env=0,fs=30,gn=0,pop=0,lt=0,lp=0,i1=0,i2=0,hx=0;
 const cg=Array.from({length:12},()=>.75+Math.random()*.5),B=[[95,.9,1.3],[240,.8,1.1],[560,.7,.8],[1400,.7,.4]].map(([fc,q,g])=>({F:2*Math.sin(Math.PI*fc/sr),q,g,l:0,b:0}));
 return function(o){
  const rpm=S.w*9.5493,run=S.run,on=run||S.crank>0,th=S.p.g,f=Math.max(rpm,30)/60*ENG.n/2,rf=Math.min(rpm/ENG.rl,1.1),load=.6+.4*th,
   de=Math.exp(-1/(sr*Math.min(.004,.35/f))),cf=Math.min(.5,6.2832*(500+th*3000+rf*1500)/sr),tg=on?(run?1:.3):0;
  for(let i=0;i<o.length;i++){
   gn+=(tg-gn)*.002;fs+=(f-fs)*.0008;ph+=fs/sr*(1+(Math.random()-.5)*.06);
   if(ph>=1){ph-=1;cc=(cc+1)%ENG.n;if(Math.random()<.1)cg[cc]=.75+Math.random()*.5;env=cg[cc]*(1-ENG.j+Math.random()*ENG.j*2)*load}
   const nz=Math.random()*2-1,x=env*(.55+.45*nz);env*=de;
   let y=0;for(const b of B){b.l+=b.F*b.b;b.b+=b.F*(x-b.l-b.q*b.b);y+=b.b*b.g}
   lp+=(x-lp)*cf;y+=lp*.8;
   i1+=(nz-i1)*.08;i2+=(nz-i2)*.3;
   y+=i1*(.1+.5*th)*rf*1.4+(nz-i2)*rf*rf*(.05+.3*th)*.5;
   if(th<.05&&run&&rpm>2500&&Math.random()<.00015)pop=1;
   y+=pop*nz*.7;pop*=.9985;
   hx+=(y-hx)*.002;y-=hx;
   o[i]=Math.tanh(y*gn*.65);
  }
 }
}
let AC;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const sp=AC.createScriptProcessor(2048,0,1),fill=engineSynth(AC.sampleRate);sp.onaudioprocess=e=>fill(e.outputBuffer.getChannelData(0));sp.connect(AC.destination)}catch(x){AC=null}}
function beep(){audio();if(!AC)return;const o=AC.createOscillator(),q=AC.createGain();o.type='square';o.frequency.value=90;q.gain.value=.05;o.connect(q);q.connect(AC.destination);o.start();o.stop(AC.currentTime+.18)}
/* input */
document.querySelectorAll('.pedal').forEach(el=>{
 const k=el.dataset.k,set=e=>{const r=el.getBoundingClientRect();S.h[k]=clamp((r.bottom-e.clientY)/r.height,0,1)};
 el.addEventListener('pointerdown',e=>{e.preventDefault();audio();el.setPointerCapture(e.pointerId);S.grab[k]=1;set(e)});
 el.addEventListener('pointermove',e=>{if(S.grab[k])set(e)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,()=>{S.grab[k]=0;S.h[k]=0}));
 el.addEventListener('contextmenu',e=>e.preventDefault());
});
$('#start').addEventListener('click',startBtn);
$('#slow').addEventListener('click',e=>{S.slow=!S.slow;e.target.classList.toggle('on',!!S.slow)});
ENGS.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e.l;$('#eng').appendChild(o)});$('#eng').value=4;
function reset(){S.run=0;S.crank=0;S.w=0;S.v=0;S.gear=0;S.ag=1;S.shT=0;S.ea=0;S.p.c=0;say('')}
$('#eng').onchange=e=>{ENG=ENGS[+e.target.value];M=1000+ENG.t*.7;reset();build()};
$('#trn').onchange=e=>{S.mode=e.target.value;reset();document.querySelector('.pw[data-k=c]').style.display=S.mode==='mt'?'':'none';buildShifter()};
const KP={KeyA:'c',KeyS:'b',KeyD:'g'};
addEventListener('keydown',e=>{if(e.repeat)return;const k=KP[e.code];if(k){S.h[k]=1;audio();e.preventDefault();return}
 if(e.code==='KeyI')startBtn();else if(e.code==='KeyR')shift(-1);else if(e.code==='KeyN')shift(0);
 else if(S.mode==='mt'&&/^Digit[0-6]$/.test(e.code))shift(+e.code[5]);
 else if(S.mode==='at'&&e.code==='KeyF')shift(7);else if(S.mode==='dct'){if(e.code==='KeyE')shift('u');if(e.code==='KeyQ')shift('d')}});
addEventListener('keyup',e=>{const k=KP[e.code];if(k)S.h[k]=0});
/* loop */
let last=performance.now();
function frame(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 const n=Math.ceil(dt/.004);for(let i=0;i<n;i++)step(dt/n);
 const rpm=S.w*9.5493;
 if(S.slow){const vr=rpm<=500?rpm:500+(rpm-500)*.03;S.vang=(S.vang+vr*6*dt)%720}
 drawEngine();drawGauges();
 if(S.mt>0)S.mt-=dt;
 $('#msg').textContent=S.mt>0?S.msg:S.crank>0?'Стартер крутить…':S.run?'Двигун працює':'Двигун вимкнено';
 const sl=S.run?'Заглушити':'Запуск';if($('#start').dataset.l!==sl){$('#start').dataset.l=sl;$('#start').innerHTML='<i class="ic'+(S.run?'':' play')+'"></i>'+sl}$('#start').classList.toggle('on',!!S.run);
 S.temp+=((S.run?82+rpm/ENG.rl*14:25)-S.temp)*Math.min(1,dt*.05);
 $('#tmp').textContent=Math.round(S.temp);$('#bar').textContent=(S.run?-.65+.65*S.p.g:0).toFixed(1);$('#kmh').textContent=Math.round(Math.abs(S.v)*3.6);
 ['c','b','g'].forEach(k=>$('#pv'+k).textContent=Math.round(S.p[k]*100)+'%');
 $('#gbig').textContent=S.gear===7?'D'+S.ag:lab(S.gear);
 document.querySelectorAll('.pedal').forEach(el=>el.style.setProperty('--p',S.p[el.dataset.k]));
 requestAnimationFrame(frame);
}
build();buildShifter();fit();addEventListener('resize',buildShifter);
requestAnimationFrame(frame);
</script></body></html>
